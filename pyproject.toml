[project]
name = "ime-mcp"
version = "0.1.0"
description = "MCP server for Iran Mercantile Exchange (IME) market data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.0",
    "jdatetime>=5.0.0",
    "mcp>=1.9.0",
    "websockets>=14.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
]

[project.scripts]
ime-mcp = "ime_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/ime_mcp"]

[tool.hatch.build.targets.wheel.sources]
"src/ime_mcp" = "ime_mcp"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: hits ime.co.ir (optional integration)",
]
